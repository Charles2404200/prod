apiVersion: 1
datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      derivedFields:
        - datasourceUid: 'prometheus' # Thay 'prometheus' bằng UID của Prometheus datasource nếu cần
          matcherRegex: 'traceID=(\w+)'
          name: TraceID
          url: '$${__value.raw}'