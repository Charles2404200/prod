version: "3.9"
#im not sure if this is supposed to be here or other folders but leave for now
services:
  backend:
    image: ghcr.io/apotato4325/rmit-store-backend:latest
    environment:
      - PORT=3000
      - MONGO_URI=mongodb+srv://RMIT_Store:123RMIT@rmitstore.uvixzgs.mongodb.net/?retryWrites=true&w=majority&appName=RMITStore
      - CLIENT_URL=http://54.242.180.228:8080
      - BASE_API_URL=api
    networks:
      - rmit-network
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      placement:
        constraints: [node.role == manager]
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
      ports:
        - published: 3000
          target: 3000
          protocol: tcp
          mode: host

  frontend:
    image: ghcr.io/apotato4325/rmit-store-frontend:latest
    environment:
      - REACT_APP_API_URL=http://54.242.180.228:3000/api
    networks:
      - rmit-network
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      placement:
        constraints: [node.role == manager]
      ports:
        - published: 8080
          target: 80
          protocol: tcp
          mode: host