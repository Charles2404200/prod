version: "3.9"

services:
  backend:
    #build:
      #this one to build locally
      # context: .
      # context: ../../  # This goes up two directories to the project root
      # dockerfile: ci/Dockerfile.backend
    #this one to pull from ghrc
    image: ghcr.io/apotato4325/rmit-store-backend:latest
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - MONGO_URI=mongodb://mongo:27017/rmit_ecommerce
      - JWT_SECRET=my_secret_string
      #docker ip is now elastic so no need to change
      - CLIENT_URL=http://localhost:8080
      - BASE_API_URL=api
    depends_on:
      - mongo
    networks:
      - rmit-network

  frontend:
    #build:
      #this one to build locally
      # context: .
      # context: ../../  # This goes up two directories to the project root
      # dockerfile: ci/Dockerfile.frontend
    #this one to pull from ghrc
    image: ghcr.io/apotato4325/rmit-store-frontend:latest
    ports:
      - "8080:80"
    environment:
    #docker ip is now elastic so no need to change
      - REACT_APP_API_URL=http://backend:3000
    depends_on:
      - backend
    networks:
      - rmit-network

  mongo:
    image: mongo:5
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - rmit-network

volumes:
  mongo_data:

networks:
  rmit-network:
    driver: bridge