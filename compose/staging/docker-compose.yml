version: "3.9"

services:
  backend:
    image: ghcr.io/apotato4325/rmit-store-backend:latest
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - MONGO_URI=mongodb+srv://leanhminh2404:Pricepc24_04@cluster0.gbm91tb.mongodb.net/rmit_ecommerce?retryWrites=true&w=majority&appName=Cluster0
      - JWT_SECRET=my_secret_string
      - CLIENT_URL=http://localhost:8080
      - BASE_API_URL=api
    # no local mongo container when using Atlas
    networks:
      - rmit-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    image: ghcr.io/apotato4325/rmit-store-frontend:latest
    ports:
      - "8080:80"
    # NOTE: React bakes this at build time; keeping here for clarity.
    environment:
      - REACT_APP_API_URL=http://localhost:3000/api
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - rmit-network

networks:
  rmit-network:
    driver: bridge
