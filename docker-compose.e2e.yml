# docker-compose.e2e.yml
services:
  mongo:
    container_name: e2e-mongo
    image: mongo:6
    ports:
      - "27018:27017"
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval 'db.runCommand({ ping: 1 })' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    container_name: e2e-backend
    build:
      context: .
      dockerfile: ci/Dockerfile.backend
    environment:
      MONGO_URI: mongodb://e2e-mongo:27017/rmit-store?directConnection=true
      NODE_ENV: test
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "3000:3000"

  frontend:
    container_name: e2e-frontend
    build:
      context: .
      dockerfile: ci/Dockerfile.frontend
    environment:
      NODE_ENV: development
      WDS_SOCKET_HOST: localhost
      WDS_SOCKET_PORT: 8080
      WDS_SOCKET_PROTOCOL: http
      DEV_SERVER_HOST: 0.0.0.0
      DEV_SERVER_PORT: 8080
    ports:
      - "8080:80"
    depends_on:
      - backend

  runner:
    container_name: e2e-runner
    image: mcr.microsoft.com/playwright:v1.44.0-jammy 
    command: >
      bash -c "
        echo 'Waiting for frontend to be ready...';
        while ! curl -s http://frontend:80 > /dev/null; do
          echo 'Frontend not up yet, sleeping...';
          sleep 2;
        done;
        echo 'Frontend is ready! Starting tests...';
        rm -rf node_modules package-lock.json && npm install && npx playwright test;
      "
    depends_on:
      - frontend
      - backend
